services:
  db:
    image: postgres:17
    container_name: gigspot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Manjka POSTGRES_USER v .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Manjka POSTGRES_PASSWORD v .env}
      POSTGRES_DB: ${POSTGRES_DB:?Manjka POSTGRES_DB v .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
